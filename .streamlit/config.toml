# Streamlit theme — dark whiskey baseline. The full Modernist look is
# applied via CSS injection in app.py; this file just ensures Streamlit's
# built-in widget internals (dropdown chevrons, slider thumbs, etc.) start
# from harmonious base colors.
[theme]
base = "dark"
primaryColor = "#e8a13c"
backgroundColor = "#191614"
secondaryBackgroundColor = "#221e1b"
textColor = "#f2efec"
font = "sans serif"
